[project]
name = "obsidian-vault-mcp-ext"
version = "0.6.0"
description = "Personal/optional extensions for jimprosser/obsidian-web-mcp, loaded via its serve(extensions=...) seam (#57). Heavy/optional-dependency and personal features that intentionally stay out of upstream core."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The host MCP server. 0.4.0 is the first release with the public audit API for
    # extensions (register_audit_operation, run_audited; upstream #93).
    "obsidian-web-mcp>=0.4.0",
]

[project.optional-dependencies]
# Heavy embedding deps live here, not in the host. SemanticExtension lazy-imports
# them so the package is usable without the extra installed.
semantic = [
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0,<2.0.0",
    "fastembed>=0.6.0",
    "rank-bm25>=0.2.2",
]
# pypdf reads PDF text layers for PdfTextExtension; without it PDFs stay unreadable.
pdf = [
    "pypdf>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vault-mcp-ext = "obsidian_vault_mcp_ext.__main__:main"
# For systemd timers: the nightly semantic rebuild and a once-off recurring run.
vault-mcp-ext-semantic = "obsidian_vault_mcp_ext.semantic.cli:main"
vault-mcp-ext-recurring = "obsidian_vault_mcp_ext.recurring.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_vault_mcp_ext"]
